# Render deployment blueprint.
#
# IMPORTANT — read the disk note below before using this for real documents.
#
# Deploy:
#   1. Push this folder to a GitHub repository
#   2. render.com -> New -> Blueprint -> pick the repo
#   3. After the first deploy, set PUBLIC_URL to the URL Render gives you,
#      then redeploy (links are built from PUBLIC_URL, so it must be correct)

services:
  - type: web
    name: mobile-signature
    runtime: node
    plan: free
    # Frankfurt, not the Oregon default: the senders and signers are in
    # Lebanon, and a round trip to the US west coast is about 280ms against
    # roughly 75ms here. That is the difference between a link preview being
    # fetched before the sender presses send and not — a chat app builds the
    # card from two requests, and on the far side of the world those two cost
    # ~2s, which is longer than it is willing to wait.
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      # Generated once by Render and kept secret. This is your sender API key.
      - key: API_KEY
        generateValue: true

      # Must match the public URL Render assigns, e.g.
      # https://mobile-signature.onrender.com
      # Set it in the dashboard after the first deploy, then redeploy.
      - key: PUBLIC_URL
        sync: false

      - key: LINK_TTL_HOURS
        value: "168"

      # Durable storage — the answer to the disk problem described below.
      # Paste a MongoDB connection string here in the Render dashboard
      # (Environment -> Add Environment Variable) and documents survive the
      # free plan wiping its disk. Left unset, the app runs exactly as before
      # and keeps everything on the local disk only.
      - key: MONGODB_URI
        sync: false

      # No DATA_DIR on the free plan: it defaults to ./data inside the project,
      # which is writable. Only point it at /var/data once you attach a real
      # disk (see the note below) — otherwise the app cannot write at all.

# ---------------------------------------------------------------------------
# THE FREE PLAN HAS NO PERSISTENT DISK.
#
# On the free plan, /var/data is wiped whenever the service restarts, redeploys,
# or wakes from sleep. Uploaded and signed documents WILL BE LOST, and signing
# links your recipients already hold will stop working.
#
# TWO WAYS TO FIX THIS — either is enough on its own:
#
#   1. Set MONGODB_URI (free). Records AND document bytes are mirrored to
#      MongoDB and reloaded at boot, so a wiped disk costs nothing. Stays on
#      the free plan. See .env.example for the connection-string format.
#
#   2. Pay for a disk (~$7/month). See the Starter instructions below.
#
# With neither, free is fine for testing that real phones can reach the app,
# but it is NOT suitable for documents that matter.
#
# For real use, switch to the Starter plan (~$7/month) and attach a disk by
# changing `plan: free` to `plan: starter` and uncommenting:
#
#    disk:
#      name: documents
#      mountPath: /var/data
#      sizeGB: 1
#
# ...and add the matching env var so the app writes to the disk:
#
#      - key: DATA_DIR
#        value: /var/data
#
# Free instances also sleep after ~15 minutes idle; the first request afterwards
# takes ~30 seconds to wake. A recipient opening your link may think it is
# broken.
# ---------------------------------------------------------------------------
